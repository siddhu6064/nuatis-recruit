kind = "api"
previewPath = "/ai"
title = "AI Server"
version = "1.0.0"
id = "artifacts/ai-server"

[[services]]
localPort = 9000
name = "AI Server"
paths = ["/ai"]

[services.development]
run = "cd artifacts/ai-server && python3 -m pip install -r requirements.txt -q && python3 -m uvicorn main:app --host 0.0.0.0 --port ${PORT}"

[services.env]
PORT = "9000"
